name: Build ShelfSort APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm ci
      - name: Build web app
        run: npm run build
      - name: Install Capacitor Android
        run: npm install @capacitor/cli @capacitor/core @capacitor/android
      - name: Add Android project
        run: npx cap add android
      - name: Sync web build into Android
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shelfsort-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
