name: Build ShelfSort APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Install Capacitor
        run: npm install @capacitor/cli @capacitor/core @capacitor/android

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Fix playlist plugin Kotlin version
        run: |
          printf '\next {\n    kotlin_version = "2.4.20"\n}\n' >> android/build.gradle
          sed -i 's/rootProject\.ext\.kotlin_version/kotlin_version/' node_modules/capacitor-plugin-playlist/android/build.gradle

      - name: Bump AGP and compileSdk to 36
        run: |
          sed -i "s/com.android.tools.build:gradle:[0-9.]*/com.android.tools.build:gradle:8.9.1/" android/build.gradle
          sed -i 's/compileSdkVersion *= *[0-9]*/compileSdkVersion = 36/' android/variables.gradle
          if [ -n "$ANDROID_HOME" ]; then yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" || true; fi

      - name: Fix Kotlin duplicate classes
        run: |
          cat >> android/app/build.gradle <<'EOF'

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

      - name: Decode app icon and splash
        run: |
          base64 -d assets/icon.png.b64 > assets/icon.png
          base64 -d assets/splash.png.b64 > assets/splash.png

      - name: Generate app icon and splash
        run: |
          npm install @capacitor/assets
          npx @capacitor/assets generate --android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shelfsort-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
